name: juvi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  juvi_api:
    path: packages/juvi_api
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

# SQLCipher support for package:sqlite3's native-assets build hook, replacing the
# (now end-of-life) sqlcipher_flutter_libs plugin. See the "Custom SQLite builds" /
# "Default binaries" sections of https://pub.dev/packages/sqlite3 (doc/hook.md in the
# sqlite3-3.5.2 source, ~/.pub-cache/hosted/pub.dev/sqlite3-3.5.2/doc/hook.md): setting
# `source: sqlcipher` selects the prebuilt SQLCipher community-edition binary for every
# supported platform instead of plain SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
