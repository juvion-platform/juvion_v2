# Playwright E2E — CI regression gate.
# Spec: .captain/specs/playwright-e2e/spec.md
#
# Phase A scope: auth-only, super_admin + principal, 5 tests.
# Job blocks merge on failure. Failure artifacts uploaded for debugging.

name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same PR/branch when a new push lands.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # No healthcheck block — Mongo 7 binds the port quickly and the
        # backend's own /api/health waits on Mongo before responding.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # The backend's BullMQ + dedup-cache + rbac-policy-cache all use
        # Redis; without this service the backend dev server hangs on
        # ECONNREFUSED 127.0.0.1:6379 and /api/health never goes green.

    env:
      # NODE_ENV is INTENTIONALLY UNSET at job scope. Setting it to
      # 'production' globally caused two cascading failures:
      #   1. `npm ci` skipped devDependencies (vitest, @testing-library/*,
      #      @playwright/test) — typecheck and tests couldn't find them.
      #   2. `vitest`-imported `src/app.ts` ran its import-time
      #      `process.exit(1)` guard for missing PAYMENT_WEBHOOK_SECRET
      #      in production, killing the test runner mid-suite.
      # Steps that genuinely need production NODE_ENV (backend dev server,
      # admin-portal preview) set it inline below.
      PORT: '3003'
      # backend/src/config/db.ts expects MONGODB_URI specifically (not
      # the docker-compose-style MONGO_URI). Keep both: MONGODB_URI for
      # the backend, MONGO_URI for any tool that reaches for the
      # alternative spelling.
      MONGODB_URI: mongodb://localhost:27017/juvion_v2_e2e
      MONGO_URI: mongodb://localhost:27017/juvion_v2_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-ci-secret
      DEV_COLLEGE_ID: '000000000000000000000001'
      # Dummy webhook secret so the backend dev server's startup guard
      # (app.ts:55) doesn't exit when run with NODE_ENV=production below.
      # The e2e suite never actually invokes the payment-webhook path.
      PAYMENT_WEBHOOK_SECRET: 'ci-dummy-webhook-secret'
      E2E_BASE_URL: http://localhost:5173
      E2E_BACKEND_URL: http://localhost:3003
      # Skip rate-limiting so serial Playwright login flows do not trip
      # the 10/15-min login limit. Production NEVER sets this.
      E2E_TESTING: '1'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # --include=dev is belt-and-braces: NODE_ENV is unset at job scope
        # now (see comment above), but the flag makes the install robust
        # against any future caller that re-introduces NODE_ENV.
        run: npm ci --include=dev

      - name: Typecheck both workspaces
        run: npm run typecheck

      - name: Run backend unit tests
        run: npm run test -w backend

      - name: Install Playwright browsers (chromium only)
        run: npm run test:install -w e2e

      - name: Build admin-portal
        run: npm run build -w admin-portal

      - name: Start backend (background)
        # NODE_ENV inline so the dev server behaves like prod for e2e
        # (no /api dev-auth bypass, no DEV_COLLEGE_ID injection). Test
        # steps above run with NODE_ENV unset (vitest defaults to 'test').
        env:
          NODE_ENV: production
        run: |
          # ts-node-dev to match dev parity; logs to a file so we can
          # tail them on failure.
          nohup npm run dev -w backend > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"

      - name: Start admin-portal preview (background)
        run: |
          # Vite preview serves the production build on port 5173 — it
          # is faster than `dev` and mirrors what CI artifacts look at.
          nohup npx --workspace admin-portal vite preview --host 0.0.0.0 --port 5173 > /tmp/portal.log 2>&1 &
          echo "Portal PID: $!"

      - name: Run Playwright tests
        run: npm run test -w e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

      - name: Upload backend log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7

      - name: Upload portal log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-log
          path: /tmp/portal.log
          retention-days: 7
