name: mobile
on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**']
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: mobile } }
    env:
      # Secrets are empty on forks and on PRs from them; every step below copes.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_REAL_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      # Same-repo PRs see the secrets too, so the release steps also check the event and branch.
      IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.9', channel: stable, cache: true }
      - run: flutter pub get
      - name: Generated client is up to date
        run: ./tool/gen_api.sh && git diff --exit-code -- packages/juvi_api
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      - name: Install host SQLite for drift tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter test --exclude-tags golden --coverage
      - name: Firebase config (the real project when the secret is set, otherwise the placeholder)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cp android/app/google-services.placeholder.json android/app/google-services.json
          fi
      - run: flutter build apk --debug
      # A release-signed bundle only from reviewed code on main, and only with the real
      # Firebase project: signed on the placeholder it would install but never get a push.
      - name: Release keystore
        if: env.IS_MAIN_PUSH == 'true' && env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_REAL_FIREBASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Outside the checkout, in the runner's temp directory; storeFile is absolute.
        # Secrets reach the files through printf only, never the log.
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Signed release bundle
        if: env.IS_MAIN_PUSH == 'true' && env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_REAL_FIREBASE == 'true'
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        if: env.IS_MAIN_PUSH == 'true' && env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_REAL_FIREBASE == 'true'
        with: { name: juvi-release-aab, path: mobile/build/app/outputs/bundle/release/app-release.aab, retention-days: 14 }
